[package]
name = "rig"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A local-first personal agent harness"
license = "MIT"
repository = "https://github.com/zzhi0/rig"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
base64 = "0.23"
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
eventsource-stream = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
