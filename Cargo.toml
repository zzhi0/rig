[package]
name = "rig"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A local-first personal agent harness"
license = "MIT"
repository = "https://github.com/zzhi0/rig"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1.0"
tempfile = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
